# Mouse Jiggler needs L2CAP PSMs 0x11/0x13, which BlueZ's "input" plugin holds
# while it serves its own HID device role. Disabling that plugin frees the
# channels for this app; it also disables Bluetooth HID *host* support
# (connecting keyboards/mice to the CardputerZero).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -P input
