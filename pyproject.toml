[project]
name = "mouse-jiggler"
version = "0.2.7"
description = "Bluetooth mouse jiggler for the M5Stack CardputerZero"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
